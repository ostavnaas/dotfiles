# reload config without killing server
bind R source-file ~/.tmux.conf \; display "reloaded"

set -g prefix C-a			  # Map to ctrl-a
bind C-a send-prefix

set -g set-titles on 			  # enable wm window titles
set -g allow-rename off

set -g history-limit 100000               # Boost history
set -g base-index 1                       # Make windows numbering at 1
set -g pane-base-index 1                  # Make pane numbering consistent with windows
set -g renumber-windows on


# Eliminating delays on ESC
set -s escape-time 0
set -g status-interval 15


set -g window-status-current-format "#[fg=black,bg=white] #I#F  #{b:pane_current_path} "
set -g window-status-format "#[fg=white,bg=default] #I#F  #{b:pane_current_path} "

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -a -c "#{pane_current_path}"

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

set -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Mouse mode on
#set -g mouse on

# Clipboard via OSC 52 (works over SSH); mouse/vi copy goes to system clipboard
set -s set-clipboard on
# Fallback if the terminal lacks OSC 52 support:
# set -s copy-command 'wl-copy'   # or 'xclip -sel clip'

# send to all panes
# bind C-x setw synchronize-panes on
# bind M-x setw synchronize-panes off

# Colors
# Status left
set -g status-left "#{?TMUX_ICON,#{TMUX_ICON},}"
set -gF status-left-style 'fg=white,bg=#{?TMUX_HOST_COLOR,#{TMUX_HOST_COLOR},default}'

# Status right
set -g status-right-style 'bg=default,fg=default'
set -g status-right-length 120
set -g status-right "  #h  #(kubectl config view --minify -o jsonpath='{.current-context}/{..namespace}' 2>/dev/null)  %Y-%m-%d 󱑀 #(TZ=Europe/Oslo date '+%%H:%%M %%Z') #[fg=#666666]#(TZ=UTC date +%%H:%%M)Z#[default] "

set -g status-style fg=white,bg=default
set -g window-status-style fg="#666666",bg=default
set -g window-status-current-style fg=red,bg=default
set -g message-style fg=white,bg=black,bright


set -g status-position bottom
set -g focus-events on
# https://jdhao.github.io/2018/10/19/tmux_nvim_true_color/
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB,*:hyperlinks,*:extkeys"
set -g extended-keys on


# Kudos to https://github.com/ianchesal/dotfiles/
# Per-directory popup session; toggles off when already inside a popup
bind a if -F '#{m:popup-*,#{session_name}}' detach-client \
    'display-popup -d "#{pane_current_path}" -w 80% -h 75% -E "tmux new-session -A -s popup-#{s/[^a-zA-Z0-9-]//:#{b:pane_current_path}}"'

bind A if -F '#{==:#{session_name},popup-global}' detach-client \
    'display-popup -w 80% -h 75% -E "tmux new-session -A -s popup-global"'
